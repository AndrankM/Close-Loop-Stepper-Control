<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#15202b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d33f36"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2476b5"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #17212b; }
      .subtitle { font-size: 15px; fill: #5e6b76; }
      .card-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; fill: #24313c; }
      .small { font-size: 12px; fill: #5e6b76; }
      .pin { font-size: 13px; font-weight: 600; }
      .net { font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#f4f7fa"/>
  <text x="700" y="42" text-anchor="middle" class="title">Raspberry Pi 5 → Four SERVO42C Drivers</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">Shared 3.3 V TTL UART · 9600 baud · one 1 kΩ series resistor on each driver TX</text>

  <!-- Raspberry Pi card -->
  <g filter="url(#shadow)">
    <rect x="45" y="128" width="455" height="382" rx="16" fill="#ffffff" stroke="#c8d1da" stroke-width="2"/>
    <rect x="45" y="128" width="455" height="58" rx="16" fill="#247a4a"/>
    <path d="M45 170 H500 V186 H45 Z" fill="#247a4a"/>
    <text x="272" y="164" text-anchor="middle" class="card-title" fill="#ffffff">Raspberry Pi 5 — 40-pin header</text>
  </g>

  <!-- Pi TX -->
  <text x="72" y="239" class="pin" fill="#d33f36">Physical pin 8</text>
  <text x="72" y="260" class="label">GPIO14 / TXD</text>
  <circle cx="280" cy="248" r="7" fill="#d33f36"/>
  <line x1="287" y1="248" x2="463" y2="248" stroke="#d33f36" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- Pi RX -->
  <text x="72" y="329" class="pin" fill="#2476b5">Physical pin 10</text>
  <text x="72" y="350" class="label">GPIO15 / RXD</text>
  <circle cx="280" cy="338" r="7" fill="#2476b5"/>
  <line x1="463" y1="338" x2="287" y2="338" stroke="#2476b5" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <!-- Pi GND -->
  <text x="72" y="419" class="pin" fill="#2e3439">Physical pin 6</text>
  <text x="72" y="440" class="label">GND (any Pi ground pin)</text>
  <circle cx="280" cy="428" r="7" fill="#2e3439"/>
  <line x1="287" y1="428" x2="470" y2="428" stroke="#2e3439" stroke-width="4"/>

  <!-- Pi net names are placed inside the Pi card to keep the center clear. -->
  <text x="445" y="238" text-anchor="end" class="small" fill="#d33f36">PI_TX_BUS</text>
  <text x="445" y="328" text-anchor="end" class="small" fill="#2476b5">PI_RX_BUS</text>
  <text x="445" y="418" text-anchor="end" class="small" fill="#2e3439">COMMON_GND</text>

  <!-- Driver 1 -->
  <g filter="url(#shadow)">
    <rect x="790" y="105" width="555" height="170" rx="14" fill="#ffffff" stroke="#c8d1da" stroke-width="2"/>
    <rect x="1120" y="105" width="225" height="170" rx="14" fill="#172633"/>
    <path d="M1120 105 H1137 V275 H1120 Z" fill="#172633"/>
    <text x="1232" y="145" text-anchor="middle" class="card-title" fill="#a9d1ff">SERVO42C #1</text>
    <text x="1232" y="169" text-anchor="middle" class="small" fill="#c2ccd5">Motor 1 · address 0xE0</text>
    <text x="1232" y="211" text-anchor="middle" class="pin" fill="#f1c75b">3V3: NOT CONNECTED</text>
    <text x="1232" y="238" text-anchor="middle" class="small" fill="#c2ccd5">Use RX · TX · G only</text>
  </g>
  <rect x="565" y="122" width="150" height="30" rx="6" fill="#d33f36"/><text x="640" y="142" text-anchor="middle" class="net">PI_TX_BUS</text>
  <line x1="715" y1="137" x2="790" y2="137" stroke="#d33f36" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="805" y="142" class="pin" fill="#d33f36">RX</text>
  <rect x="565" y="172" width="150" height="30" rx="6" fill="#2476b5"/><text x="640" y="192" text-anchor="middle" class="net">PI_RX_BUS</text>
  <line x1="715" y1="187" x2="735" y2="187" stroke="#2476b5" stroke-width="3"/>
  <rect x="735" y="176" width="62" height="22" fill="#fff8df" stroke="#2476b5" stroke-width="2"/>
  <text x="766" y="171" text-anchor="middle" class="small" fill="#2476b5">R1 1 kΩ</text>
  <line x1="797" y1="187" x2="870" y2="187" stroke="#2476b5" stroke-width="3"/>
  <text x="880" y="192" class="pin" fill="#2476b5">TX</text>
  <rect x="565" y="222" width="150" height="30" rx="6" fill="#2e3439"/><text x="640" y="242" text-anchor="middle" class="net">COMMON_GND</text>
  <line x1="715" y1="237" x2="790" y2="237" stroke="#2e3439" stroke-width="3"/>
  <text x="805" y="242" class="pin" fill="#2e3439">G</text>

  <!-- Driver 2 -->
  <g filter="url(#shadow)">
    <rect x="790" y="310" width="555" height="170" rx="14" fill="#ffffff" stroke="#c8d1da" stroke-width="2"/>
    <rect x="1120" y="310" width="225" height="170" rx="14" fill="#172633"/>
    <path d="M1120 310 H1137 V480 H1120 Z" fill="#172633"/>
    <text x="1232" y="350" text-anchor="middle" class="card-title" fill="#a9d1ff">SERVO42C #2</text>
    <text x="1232" y="374" text-anchor="middle" class="small" fill="#c2ccd5">Motor 2 · address 0xE1</text>
    <text x="1232" y="416" text-anchor="middle" class="pin" fill="#f1c75b">3V3: NOT CONNECTED</text>
    <text x="1232" y="443" text-anchor="middle" class="small" fill="#c2ccd5">Use RX · TX · G only</text>
  </g>
  <rect x="565" y="327" width="150" height="30" rx="6" fill="#d33f36"/><text x="640" y="347" text-anchor="middle" class="net">PI_TX_BUS</text>
  <line x1="715" y1="342" x2="790" y2="342" stroke="#d33f36" stroke-width="3" marker-end="url(#arrow-red)"/><text x="805" y="347" class="pin" fill="#d33f36">RX</text>
  <rect x="565" y="377" width="150" height="30" rx="6" fill="#2476b5"/><text x="640" y="397" text-anchor="middle" class="net">PI_RX_BUS</text>
  <line x1="715" y1="392" x2="735" y2="392" stroke="#2476b5" stroke-width="3"/><rect x="735" y="381" width="62" height="22" fill="#fff8df" stroke="#2476b5" stroke-width="2"/><text x="766" y="376" text-anchor="middle" class="small" fill="#2476b5">R2 1 kΩ</text><line x1="797" y1="392" x2="870" y2="392" stroke="#2476b5" stroke-width="3"/><text x="880" y="397" class="pin" fill="#2476b5">TX</text>
  <rect x="565" y="427" width="150" height="30" rx="6" fill="#2e3439"/><text x="640" y="447" text-anchor="middle" class="net">COMMON_GND</text>
  <line x1="715" y1="442" x2="790" y2="442" stroke="#2e3439" stroke-width="3"/><text x="805" y="447" class="pin" fill="#2e3439">G</text>

  <!-- Driver 3 -->
  <g filter="url(#shadow)">
    <rect x="790" y="515" width="555" height="170" rx="14" fill="#ffffff" stroke="#c8d1da" stroke-width="2"/>
    <rect x="1120" y="515" width="225" height="170" rx="14" fill="#172633"/>
    <path d="M1120 515 H1137 V685 H1120 Z" fill="#172633"/>
    <text x="1232" y="555" text-anchor="middle" class="card-title" fill="#a9d1ff">SERVO42C #3</text>
    <text x="1232" y="579" text-anchor="middle" class="small" fill="#c2ccd5">Motor 3 · address 0xE2</text>
    <text x="1232" y="621" text-anchor="middle" class="pin" fill="#f1c75b">3V3: NOT CONNECTED</text>
    <text x="1232" y="648" text-anchor="middle" class="small" fill="#c2ccd5">Use RX · TX · G only</text>
  </g>
  <rect x="565" y="532" width="150" height="30" rx="6" fill="#d33f36"/><text x="640" y="552" text-anchor="middle" class="net">PI_TX_BUS</text>
  <line x1="715" y1="547" x2="790" y2="547" stroke="#d33f36" stroke-width="3" marker-end="url(#arrow-red)"/><text x="805" y="552" class="pin" fill="#d33f36">RX</text>
  <rect x="565" y="582" width="150" height="30" rx="6" fill="#2476b5"/><text x="640" y="602" text-anchor="middle" class="net">PI_RX_BUS</text>
  <line x1="715" y1="597" x2="735" y2="597" stroke="#2476b5" stroke-width="3"/><rect x="735" y="586" width="62" height="22" fill="#fff8df" stroke="#2476b5" stroke-width="2"/><text x="766" y="581" text-anchor="middle" class="small" fill="#2476b5">R3 1 kΩ</text><line x1="797" y1="597" x2="870" y2="597" stroke="#2476b5" stroke-width="3"/><text x="880" y="602" class="pin" fill="#2476b5">TX</text>
  <rect x="565" y="632" width="150" height="30" rx="6" fill="#2e3439"/><text x="640" y="652" text-anchor="middle" class="net">COMMON_GND</text>
  <line x1="715" y1="647" x2="790" y2="647" stroke="#2e3439" stroke-width="3"/><text x="805" y="652" class="pin" fill="#2e3439">G</text>

  <!-- Driver 4 -->
  <g filter="url(#shadow)">
    <rect x="790" y="720" width="555" height="170" rx="14" fill="#ffffff" stroke="#c8d1da" stroke-width="2"/>
    <rect x="1120" y="720" width="225" height="170" rx="14" fill="#172633"/>
    <path d="M1120 720 H1137 V890 H1120 Z" fill="#172633"/>
    <text x="1232" y="760" text-anchor="middle" class="card-title" fill="#a9d1ff">SERVO42C #4</text>
    <text x="1232" y="784" text-anchor="middle" class="small" fill="#c2ccd5">Motor 4 · address 0xE3</text>
    <text x="1232" y="826" text-anchor="middle" class="pin" fill="#f1c75b">3V3: NOT CONNECTED</text>
    <text x="1232" y="853" text-anchor="middle" class="small" fill="#c2ccd5">Use RX · TX · G only</text>
  </g>
  <rect x="565" y="737" width="150" height="30" rx="6" fill="#d33f36"/><text x="640" y="757" text-anchor="middle" class="net">PI_TX_BUS</text>
  <line x1="715" y1="752" x2="790" y2="752" stroke="#d33f36" stroke-width="3" marker-end="url(#arrow-red)"/><text x="805" y="757" class="pin" fill="#d33f36">RX</text>
  <rect x="565" y="787" width="150" height="30" rx="6" fill="#2476b5"/><text x="640" y="807" text-anchor="middle" class="net">PI_RX_BUS</text>
  <line x1="715" y1="802" x2="735" y2="802" stroke="#2476b5" stroke-width="3"/><rect x="735" y="791" width="62" height="22" fill="#fff8df" stroke="#2476b5" stroke-width="2"/><text x="766" y="786" text-anchor="middle" class="small" fill="#2476b5">R4 1 kΩ</text><line x1="797" y1="802" x2="870" y2="802" stroke="#2476b5" stroke-width="3"/><text x="880" y="807" class="pin" fill="#2476b5">TX</text>
  <rect x="565" y="837" width="150" height="30" rx="6" fill="#2e3439"/><text x="640" y="857" text-anchor="middle" class="net">COMMON_GND</text>
  <line x1="715" y1="852" x2="790" y2="852" stroke="#2e3439" stroke-width="3"/><text x="805" y="857" class="pin" fill="#2e3439">G</text>

  <!-- Safety note -->
  <rect x="45" y="555" width="455" height="212" rx="14" fill="#fff8df" stroke="#e1b94c" stroke-width="2"/>
  <text x="72" y="590" class="card-title" fill="#705711">Exact connection checklist</text>
  <text x="72" y="624" class="label">1. Pi pin 8 (TXD) → all four driver RX pins.</text>
  <text x="72" y="654" class="label">2. Each driver TX → its own 1 kΩ → Pi pin 10.</text>
  <text x="72" y="684" class="label">3. Pi GND → all four driver G pins.</text>
  <text x="72" y="714" class="label">4. Leave every driver 3V3 pin disconnected.</text>
  <text x="72" y="746" class="pin" fill="#b3342c">Switch off Pi and motor power before wiring.</text>

  <text x="45" y="900" class="small">Matching net labels are electrically the same connection. This layout intentionally uses no crossing wires.</text>
</svg>